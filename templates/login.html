{% extends 'base.html' %}
{% block title %}Login - Task Manager{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
<style>
    .auth-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 120px);
    }
    .auth-card {
        background: #ffffff;
        border-radius: 24px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.05);
        padding: 40px;
        width: 100%;
        max-width: 420px;
        text-align: center;
    }
    html[data-bs-theme="dark"] .auth-card {
        background: #2b2f33;
        box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    .auth-icon {
        width: 48px;
        height: 48px;
        background: #f4f5f7;
        border-radius: 14px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0 auto 20px auto;
        font-size: 1.2rem;
        color: #333;
    }
    html[data-bs-theme="dark"] .auth-icon {
        background: #3c4146;
        color: #fff;
    }
    .auth-title {
        font-weight: 600;
        font-size: 1.5rem;
        margin-bottom: 10px;
        color: #111;
    }
    html[data-bs-theme="dark"] .auth-title {
        color: #f8f9fa;
    }
    .auth-subtitle {
        font-size: 0.9rem;
        color: #666;
        margin-bottom: 30px;
        line-height: 1.5;
        padding: 0 10px;
    }
    html[data-bs-theme="dark"] .auth-subtitle {
        color: #aaa;
    }
    .input-group-custom {
        position: relative;
        margin-bottom: 15px;
    }
    .input-group-custom i {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: #999;
    }
    .form-control-custom {
        width: 100%;
        height: 48px;
        background-color: #f4f5f7;
        border: none;
        border-radius: 12px;
        padding-left: 45px;
        padding-right: 15px;
        font-size: 0.95rem;
        color: #333;
        outline: none;
        transition: background-color 0.3s;
    }
    .form-control-custom:focus {
        background-color: #e9ecef;
    }
    html[data-bs-theme="dark"] .form-control-custom {
        background-color: #3c4146;
        color: #f8f9fa;
    }
    html[data-bs-theme="dark"] .form-control-custom:focus {
        background-color: #4a5056;
    }
    .btn-auth {
        background-color: #1a1a1a;
        color: #ffffff;
        height: 48px;
        border-radius: 12px;
        font-weight: 500;
        width: 100%;
        border: none;
        margin-top: 10px;
        transition: background-color 0.3s;
    }
    .btn-auth:hover {
        background-color: #000000;
        color: #ffffff;
    }
    html[data-bs-theme="dark"] .btn-auth {
        background-color: #f8f9fa;
        color: #1a1a1a;
    }
    html[data-bs-theme="dark"] .btn-auth:hover {
        background-color: #e2e6ea;
        color: #1a1a1a;
    }
    .auth-link {
        font-size: 0.85rem;
        color: #666;
        text-decoration: none;
        margin-top: 20px;
        display: block;
    }
    .auth-link:hover {
        color: #1a1a1a;
    }
    html[data-bs-theme="dark"] .auth-link:hover {
        color: #fff;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-icon">
            <i class="bi bi-box-arrow-in-right"></i>
        </div>
        <h3 class="auth-title">Sign in</h3>
        <p class="auth-subtitle">Bring your tasks, projects, and teams together seamlessly. For free</p>
        
        <div id="login-error" class="alert alert-danger hidden" style="font-size:0.85rem; border-radius:12px; text-align:left;"></div>
        
        <form id="login-form">
            <div class="input-group-custom">
                <i class="bi bi-person"></i>
                <input type="text" class="form-control-custom" id="username" placeholder="Username" required>
            </div>
            <div class="input-group-custom">
                <i class="bi bi-lock"></i>
                <input type="password" class="form-control-custom" id="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn-auth">Get Started</button>
        </form>
        
        <a href="/register/" class="auth-link">Or create an account</a>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const errorDiv = document.getElementById('login-error');
    errorDiv.classList.add('hidden');

    try {
        const response = await fetch('/api/token/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        
        const data = await response.json();
        
        if (response.ok) {
            setAuthToken(data.access, data.refresh);
            
            // Fetch user profile to get role and username
            const profileRes = await fetchWithAuth('/api/users/profile/');
            if (profileRes.ok) {
                const profile = await profileRes.json();
                localStorage.setItem('user_role', profile.role);
                localStorage.setItem('user_id', profile.id);
                localStorage.setItem('user_name', profile.username);
            }
            
            window.location.href = '/dashboard/';
        } else {
            errorDiv.innerText = data.detail || 'Invalid credentials';
            errorDiv.classList.remove('hidden');
        }
    } catch (err) {
        errorDiv.innerText = 'Server error. Try again.';
        errorDiv.classList.remove('hidden');
    }
});
</script>
{% endblock %}
