{% extends 'base.html' %}
{% block title %}Tasks - Task Manager{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Tasks</h2>
    <button class="btn btn-primary hidden" id="create-task-btn" data-bs-toggle="modal" data-bs-target="#taskModal">Create Task</button>
</div>

<div class="table-responsive">
    <table class="table table-hover align-middle">
        <thead class="table-dark">
            <tr>
                <th>Title</th>
                <th>Project</th>
                <th>Assignee</th>
                <th>Status</th>
                <th>Due Date</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="tasks-list">
            <!-- Tasks will be loaded here -->
        </tbody>
    </table>
</div>

<!-- Task Modal -->
<div class="modal fade" id="taskModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Create Task</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="task-form">
                    <div class="mb-3">
                        <label class="form-label">Title</label>
                        <input type="text" class="form-control" id="task-title" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" id="task-desc"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Project</label>
                        <select class="form-select" id="task-project" required>
                            <option value="">Select a project...</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Assignee</label>
                        <select class="form-select" id="task-assignee">
                            <option value="">Unassigned</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Due Date</label>
                        <input type="date" class="form-control" id="task-due">
                    </div>
                    <button type="submit" class="btn btn-primary">Save</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
async function loadTasks() {
    try {
        const response = await fetchWithAuth('/api/tasks/');
        if (response.ok) {
            const tasks = await response.json();
            const container = document.getElementById('tasks-list');
            container.innerHTML = '';
            
            const role = localStorage.getItem('user_role');
            const userId = parseInt(localStorage.getItem('user_id'));

            tasks.forEach(t => {
                let badgeClass = 'bg-secondary';
                if (t.status === 'In Progress') badgeClass = 'bg-warning';
                if (t.status === 'Completed') badgeClass = 'bg-success';

                let actionHtml = '';
                if (role === 'Admin') {
                    actionHtml = `
                        <div class="d-flex gap-2">
                            <select class="form-select form-select-sm" style="max-width: 130px;" onchange="updateTaskStatus(${t.id}, this.value)">
                                <option value="Pending" ${t.status==='Pending'?'selected':''}>Pending</option>
                                <option value="In Progress" ${t.status==='In Progress'?'selected':''}>In Progress</option>
                                <option value="Completed" ${t.status==='Completed'?'selected':''}>Completed</option>
                            </select>
                            <button class="btn btn-sm btn-danger" onclick="deleteTask(${t.id})">Delete</button>
                        </div>
                    `;
                } else if (t.assignee && t.assignee === userId) {
                    actionHtml = `
                        <select class="form-select form-select-sm" style="max-width: 130px;" onchange="updateTaskStatus(${t.id}, this.value)">
                            <option value="Pending" ${t.status==='Pending'?'selected':''}>Pending</option>
                            <option value="In Progress" ${t.status==='In Progress'?'selected':''}>In Progress</option>
                            <option value="Completed" ${t.status==='Completed'?'selected':''}>Completed</option>
                        </select>
                    `;
                } else {
                    actionHtml = `<span class="badge ${badgeClass}">${t.status}</span>`;
                }

                container.innerHTML += `
                    <tr>
                        <td>${t.title}</td>
                        <td>${t.project_detail.name}</td>
                        <td>${t.assignee_detail ? t.assignee_detail.username : 'Unassigned'}</td>
                        <td><span class="badge ${badgeClass}" id="badge-${t.id}">${t.status}</span></td>
                        <td>${t.due_date || '-'}</td>
                        <td>${actionHtml}</td>
                    </tr>
                `;
            });
        }
    } catch (err) {
        console.error(err);
    }
}

async function updateTaskStatus(taskId, status) {
    try {
        const res = await fetchWithAuth(`/api/tasks/${taskId}/`, {
            method: 'PATCH',
            body: JSON.stringify({ status })
        });
        if (res.ok) {
            loadTasks();
        } else {
            alert('Failed to update status.');
        }
    } catch (err) {
        console.error(err);
    }
}

async function deleteTask(taskId) {
    if (!confirm('Are you sure you want to delete this task?')) return;
    try {
        const res = await fetchWithAuth(`/api/tasks/${taskId}/`, {
            method: 'DELETE'
        });
        if (res.ok) {
            loadTasks();
        } else {
            alert('Failed to delete task.');
        }
    } catch (err) {
        console.error(err);
    }
}

document.getElementById('task-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const title = document.getElementById('task-title').value;
    const description = document.getElementById('task-desc').value;
    const project = document.getElementById('task-project').value;
    const assignee = document.getElementById('task-assignee').value;
    const due_date = document.getElementById('task-due').value;

    const payload = { title, description, project };
    if (assignee) payload.assignee = assignee;
    if (due_date) payload.due_date = due_date;

    try {
        const response = await fetchWithAuth('/api/tasks/', {
            method: 'POST',
            body: JSON.stringify(payload)
        });
        if (response.ok) {
            const modal = bootstrap.Modal.getInstance(document.getElementById('taskModal'));
            modal.hide();
            loadTasks();
        } else {
            alert("Failed to create task. Make sure you're an Admin and IDs are valid.");
        }
    } catch (err) {
        console.error(err);
    }
});

window.allProjects = [];

async function loadFormOptions() {
    try {
        const projectsRes = await fetchWithAuth('/api/projects/');
        if (projectsRes.ok) {
            window.allProjects = await projectsRes.json();
            const pSelect = document.getElementById('task-project');
            window.allProjects.forEach(p => {
                pSelect.innerHTML += `<option value="${p.id}">${p.name}</option>`;
            });
        }
    } catch (err) {
        console.error('Failed to load form options', err);
    }
}

document.getElementById('task-project').addEventListener('change', function(e) {
    const projectId = parseInt(e.target.value);
    const uSelect = document.getElementById('task-assignee');
    uSelect.innerHTML = '<option value="">Unassigned</option>';
    
    if (!projectId) return;

    const project = window.allProjects.find(p => p.id === projectId);
    if (project && project.members_detail) {
        project.members_detail.forEach(u => {
            uSelect.innerHTML += `<option value="${u.id}">${u.username} (${u.role})</option>`;
        });
    }
});

document.addEventListener('DOMContentLoaded', () => {
    if (getAuthToken()) {
        const role = localStorage.getItem('user_role');
        if (role === 'Admin') {
            document.getElementById('create-task-btn').classList.remove('hidden');
            loadFormOptions();
        }
        loadTasks();
    }
});
</script>
{% endblock %}
