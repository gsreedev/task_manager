<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Task Manager{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html[data-bs-theme="light"] body { background-color: #f8f9fa; }
        .hidden { display: none !important; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Task Manager</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto gap-2 py-2 py-lg-0" id="nav-links">
                    <li class="nav-item hidden" id="nav-dashboard">
                        <a class="btn btn-outline-light" href="/">Dashboard</a>
                    </li>
                    <li class="nav-item hidden" id="nav-projects">
                        <a class="btn btn-outline-light" href="/projects/">Projects</a>
                    </li>
                    <li class="nav-item hidden" id="nav-tasks">
                        <a class="btn btn-outline-light" href="/tasks/">Tasks</a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto" id="auth-links">
                    <li class="nav-item d-flex align-items-center me-3">
                        <button class="btn btn-sm btn-outline-secondary text-light" id="theme-toggle" onclick="toggleTheme()">🌙 Dark</button>
                    </li>
                    <li class="nav-item hidden" id="nav-user-info">
                        <span class="nav-link text-light">Welcome, <strong id="user-name-display"></strong></span>
                    </li>
                    <li class="nav-item hidden" id="nav-logout">
                        <button class="btn btn-outline-danger btn-sm ms-2 mt-1" onclick="logout(event)">Log Out</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = '/api';

        function toggleTheme() {
            const htmlEl = document.documentElement;
            const currentTheme = htmlEl.getAttribute('data-bs-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            htmlEl.setAttribute('data-bs-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeButton(newTheme);
        }

        function updateThemeButton(theme) {
            const btn = document.getElementById('theme-toggle');
            if (btn) {
                btn.innerText = theme === 'dark' ? '☀️ Light' : '🌙 Dark';
                if(theme === 'dark') {
                    btn.classList.remove('btn-outline-secondary', 'text-light');
                    btn.classList.add('btn-outline-light');
                } else {
                    btn.classList.remove('btn-outline-light');
                    btn.classList.add('btn-outline-secondary', 'text-light');
                }
            }
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
            updateThemeButton(savedTheme);
        }

        function getAuthToken() {
            return localStorage.getItem('access_token');
        }

        function setAuthToken(token, refreshToken) {
            localStorage.setItem('access_token', token);
            localStorage.setItem('refresh_token', refreshToken);
        }

        function clearAuth() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            localStorage.removeItem('user_role');
            localStorage.removeItem('user_id');
            localStorage.removeItem('user_name');
        }

        function logout(e) {
            e.preventDefault();
            clearAuth();
            window.location.href = '/login/';
        }

        async function fetchWithAuth(url, options = {}) {
            let token = getAuthToken();
            if (!options.headers) {
                options.headers = {};
            }
            if (token) {
                options.headers['Authorization'] = `Bearer ${token}`;
            }
            options.headers['Content-Type'] = 'application/json';

            let response = await fetch(url, options);

            // Handle token expiration
            if (response.status === 401 && token) {
                const refreshToken = localStorage.getItem('refresh_token');
                if (refreshToken) {
                    const refreshRes = await fetch(`${API_URL}/token/refresh/`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ refresh: refreshToken })
                    });
                    if (refreshRes.ok) {
                        const data = await refreshRes.json();
                        setAuthToken(data.access, refreshToken);
                        options.headers['Authorization'] = `Bearer ${data.access}`;
                        response = await fetch(url, options);
                    } else {
                        clearAuth();
                        window.location.href = '/login/';
                    }
                } else {
                    clearAuth();
                    window.location.href = '/login/';
                }
            }
            return response;
        }

        function checkAuth() {
            const token = getAuthToken();
            const currentPath = window.location.pathname;
            const publicPaths = ['/login/', '/register/'];

            if (token) {
                document.getElementById('nav-dashboard').classList.remove('hidden');
                document.getElementById('nav-projects').classList.remove('hidden');
                document.getElementById('nav-tasks').classList.remove('hidden');
                document.getElementById('nav-user-info').classList.remove('hidden');
                document.getElementById('nav-logout').classList.remove('hidden');
                
                const userName = localStorage.getItem('user_name');
                if (userName) {
                    document.getElementById('user-name-display').innerText = userName;
                }

                if (publicPaths.includes(currentPath)) {
                    window.location.href = '/';
                }
            } else {
                if (!publicPaths.includes(currentPath)) {
                    window.location.href = '/login/';
                }
            }
        }

        // Run auth check on load
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            checkAuth();
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
