{% extends 'base.html' %}
{% block title %}Projects - Task Manager{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Projects</h2>
    <button class="btn btn-primary hidden" id="create-project-btn" data-bs-toggle="modal" data-bs-target="#projectModal">Create Project</button>
</div>

<div class="row" id="projects-list">
    <!-- Projects will be loaded here -->
</div>

<!-- Project Modal -->
<div class="modal fade" id="projectModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Create Project</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="project-form">
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" class="form-control" id="project-name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" id="project-desc"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Members</label>
                        <select multiple class="form-select" id="project-members">
                            <!-- Populated by JS -->
                        </select>
                        <small class="text-muted">Hold Ctrl/Cmd to select multiple.</small>
                    </div>
                    <button type="submit" class="btn btn-primary">Save</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Edit Members Modal -->
<div class="modal fade" id="editMembersModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit Project Members</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="edit-members-form">
                    <input type="hidden" id="edit-project-id">
                    <div class="mb-3">
                        <label class="form-label">Members</label>
                        <select multiple class="form-select" id="edit-project-members">
                            <!-- Populated by JS -->
                        </select>
                        <small class="text-muted">Hold Ctrl/Cmd to select multiple.</small>
                    </div>
                    <button type="submit" class="btn btn-primary">Update Members</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
async function loadProjects() {
    try {
        const response = await fetchWithAuth('/api/projects/');
        if (response.ok) {
            const projects = await response.json();
            const container = document.getElementById('projects-list');
            container.innerHTML = '';
            const role = localStorage.getItem('user_role');
            window.allProjects = projects;
            projects.forEach(p => {
                const deleteBtn = role === 'Admin' ? `<button class="btn btn-sm btn-danger float-end" onclick="deleteProject(${p.id})">Delete</button>` : '';
                const editMembersBtn = role === 'Admin' ? `<button class="btn btn-sm btn-outline-secondary float-end me-2" onclick="openEditMembersModal(${p.id})">Members</button>` : '';
                
                const membersList = p.members_detail && p.members_detail.length > 0 
                    ? p.members_detail.map(m => m.username).join(', ') 
                    : 'None';

                container.innerHTML += `
                    <div class="col-md-4 mb-3">
                        <div class="card shadow-sm h-100">
                            <div class="card-body">
                                ${deleteBtn}
                                ${editMembersBtn}
                                <h5 class="card-title">${p.name}</h5>
                                <p class="card-text text-muted">${p.description}</p>
                                <p class="card-text mb-1"><small><strong>Owner:</strong> ${p.owner.username}</small></p>
                                <p class="card-text"><small><strong>Members:</strong> ${membersList}</small></p>
                            </div>
                        </div>
                    </div>
                `;
            });
        }
    } catch (err) {
        console.error(err);
    }
}

async function deleteProject(id) {
    if (!confirm('Are you sure you want to delete this project?')) return;
    try {
        const response = await fetchWithAuth(`/api/projects/${id}/`, {
            method: 'DELETE'
        });
        if (response.ok) {
            loadProjects();
        } else {
            alert('Failed to delete project.');
        }
    } catch (err) {
        console.error(err);
    }
}

document.getElementById('project-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const name = document.getElementById('project-name').value;
    const description = document.getElementById('project-desc').value;
    const mSelect = document.getElementById('project-members');
    const members = Array.from(mSelect.selectedOptions).map(opt => parseInt(opt.value));

    try {
        const response = await fetchWithAuth('/api/projects/', {
            method: 'POST',
            body: JSON.stringify({ name, description, members })
        });
        if (response.ok) {
            const modal = bootstrap.Modal.getInstance(document.getElementById('projectModal'));
            modal.hide();
            loadProjects();
        } else {
            alert("Failed to create project. Make sure you're an Admin.");
        }
    } catch (err) {
        console.error(err);
    }
});

window.allUsers = [];
window.allProjects = [];

async function loadFormOptions() {
    try {
        const usersRes = await fetchWithAuth('/api/users/');
        if (usersRes.ok) {
            window.allUsers = await usersRes.json();
            const mSelect = document.getElementById('project-members');
            const editSelect = document.getElementById('edit-project-members');
            mSelect.innerHTML = '';
            editSelect.innerHTML = '';
            window.allUsers.forEach(u => {
                const opt = `<option value="${u.id}">${u.username} (${u.role})</option>`;
                mSelect.innerHTML += opt;
                editSelect.innerHTML += opt;
            });
        }
    } catch (err) {
        console.error('Failed to load form options', err);
    }
}

function openEditMembersModal(projectId) {
    const project = window.allProjects.find(p => p.id === projectId);
    if (!project) return;
    
    document.getElementById('edit-project-id').value = project.id;
    const editSelect = document.getElementById('edit-project-members');
    
    // Clear and set selections
    Array.from(editSelect.options).forEach(opt => {
        opt.selected = project.members.includes(parseInt(opt.value));
    });
    
    new bootstrap.Modal(document.getElementById('editMembersModal')).show();
}

document.getElementById('edit-members-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const projectId = document.getElementById('edit-project-id').value;
    const editSelect = document.getElementById('edit-project-members');
    const members = Array.from(editSelect.selectedOptions).map(opt => parseInt(opt.value));

    try {
        const response = await fetchWithAuth(`/api/projects/${projectId}/`, {
            method: 'PATCH',
            body: JSON.stringify({ members })
        });
        if (response.ok) {
            const modal = bootstrap.Modal.getInstance(document.getElementById('editMembersModal'));
            if(modal) modal.hide();
            loadProjects();
        } else {
            alert("Failed to update members.");
        }
    } catch (err) {
        console.error(err);
    }
});

document.addEventListener('DOMContentLoaded', () => {
    if (getAuthToken()) {
        const role = localStorage.getItem('user_role');
        if (role === 'Admin') {
            document.getElementById('create-project-btn').classList.remove('hidden');
            loadFormOptions();
        }
        loadProjects();
    }
});
</script>
{% endblock %}
